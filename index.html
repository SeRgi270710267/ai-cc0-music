<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI CC0 Music</title>
    <meta
      name="description"
      content="Listen to AI CC0 Music — a Spotify-style player for the public Mureka catalog."
    />
    <link rel="icon" href="https://static-cos.mureka.ai/cos-prod/mureka/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar">
        <div class="nav-card">
          <a class="nav-link active" data-view="home" href="#/">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 1.515a3 3 0 0 0-3 0L3 5.845a3 3 0 0 0-1.5 2.598v7.114a3 3 0 0 0 1.5 2.598l7.5 4.33a3 3 0 0 0 3 0l7.5-4.33a3 3 0 0 0 1.5-2.598V8.443a3 3 0 0 0-1.5-2.598l-7.5-4.33zM12 12.75a2.25 2.25 0 1 1 0-4.5 2.25 2.25 0 0 1 0 4.5z"/></svg>
            Home
          </a>
          <a class="nav-link" data-view="search" href="#/search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 1 0 4.686 13.32l4.247 4.247a1 1 0 0 0 1.414-1.414l-4.247-4.247A7.5 7.5 0 0 0 10.5 3zm-5.5 7.5a5.5 5.5 0 1 1 11 0 5.5 5.5 0 0 1-11 0z"/></svg>
            Search
          </a>
        </div>
        <div class="lib-card">
          <div class="lib-head">
            <span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.75A.75.75 0 0 1 3.75 5h16.5a.75.75 0 0 1 0 1.5H3.75A.75.75 0 0 1 3 5.75zm0 6A.75.75 0 0 1 3.75 11h16.5a.75.75 0 0 1 0 1.5H3.75A.75.75 0 0 1 3 11.75zm0 6A.75.75 0 0 1 3.75 17h10.5a.75.75 0 0 1 0 1.5H3.75A.75.75 0 0 1 3 17.75z"/></svg>
              Your Library
            </span>
          </div>
          <button class="lib-playlist" data-view="home" type="button">
            <img id="lib-avatar" alt="" />
            <span>
              <strong id="lib-name">AI CC0 Music</strong>
              <small>Artist · CC0</small>
            </span>
          </button>
          <button class="lib-playlist" data-view="library" type="button">
            <div class="liked-ico">♥</div>
            <span>
              <strong>Liked Songs</strong>
              <small>Playlist</small>
            </span>
          </button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="top-nav">
            <button class="round" id="back-btn" type="button" aria-label="Back">‹</button>
            <button class="round" id="fwd-btn" type="button" aria-label="Forward">›</button>
          </div>
          <form class="search-wrap" id="search-form">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 1 0 4.686 13.32l4.247 4.247a1 1 0 0 0 1.414-1.414l-4.247-4.247A7.5 7.5 0 0 0 10.5 3zm-5.5 7.5a5.5 5.5 0 1 1 11 0 5.5 5.5 0 0 1-11 0z"/></svg>
            <input id="search-input" type="search" placeholder="What do you want to play?" autocomplete="off" />
          </form>
          <a class="pill" id="mureka-link" href="https://www.mureka.ai/profile?user_id=146903878795265" target="_blank" rel="noopener">Open on Mureka</a>
        </header>
        <div id="view" class="view"></div>
      </main>

      <aside class="now" id="now-panel" hidden>
        <div class="now-head">
          <strong id="now-title">Now playing</strong>
          <button class="icon-btn" id="close-now" type="button" aria-label="Close">×</button>
        </div>
        <img id="now-cover" alt="" />
        <h3 id="now-song"></h3>
        <p id="now-artist"></p>
        <div class="lyrics" id="lyrics"></div>
      </aside>
    </div>

    <footer class="player">
      <div class="now-mini">
        <img id="p-cover" alt="" />
        <div>
          <div id="p-title">Select a track</div>
          <div id="p-artist">AI CC0 Music</div>
        </div>
        <button class="icon-btn" id="like-btn" type="button" aria-label="Like">♡</button>
      </div>
      <div class="transport">
        <div class="t-btns">
          <button class="icon-btn" id="shuffle-btn" type="button" aria-label="Shuffle">
            <svg viewBox="0 0 24 24"><path d="M17 3h4v4h-2V6.41l-4.3 4.3-1.4-1.42L17.58 5H17V3zM3 7h6.58l4.3 4.3 1.42-1.42L10.41 5H3v2zm14 10v-1.59l-3.7-3.7-1.4 1.42 4.28 4.28H17v1.59h4v-4h-2v.59zM3 17h6.59l1.7-1.7-1.41-1.41L7.17 15H3v2z"/></svg>
          </button>
          <button class="icon-btn" id="prev-btn" type="button" aria-label="Previous">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6V6zm3.5 6 8.5 6V6l-8.5 6z"/></svg>
          </button>
          <button class="play" id="play-btn" type="button" aria-label="Play">
            <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="icon-btn" id="next-btn" type="button" aria-label="Next">
            <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2V6zM6 18l8.5-6L6 6v12z"/></svg>
          </button>
          <button class="icon-btn" id="repeat-btn" type="button" aria-label="Repeat">
            <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
          </button>
        </div>
        <div class="seek">
          <span id="cur-time">0:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0" />
          <span id="dur-time">0:00</span>
        </div>
      </div>
      <div class="extras">
        <button class="icon-btn" id="lyrics-btn" type="button" aria-label="Lyrics">♪</button>
        <div class="vol">
          <input id="vol" type="range" min="0" max="1" step="0.01" value="0.9" />
        </div>
      </div>
    </footer>
    <nav class="mobile-nav">
      <a data-view="home" href="#/">Home</a>
      <a data-view="search" href="#/search">Search</a>
      <a data-view="library" href="#/library">Library</a>
    </nav>
    <audio id="audio" preload="metadata"></audio>
    <script src="./app.js"></script>
  </body>
</html>
